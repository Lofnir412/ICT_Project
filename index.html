<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Top-Down Shooter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Home Page -->
    <div id="home-page">
      <div class="home-container">
        <div class="game-title">
          <h1>TANK SHOOTER</h1>
          <div class="title-accent"></div>
        </div>
        
        <div class="skins-section">
          <div class="skins-header">
            <h3>Tank Skin</h3>
            <div id="coins-display" class="coins-display">
              <span class="coins-icon">🪙</span>
              <span id="coins-value">0</span> coins
            </div>
          </div>
          <div id="skin-selector" class="skin-selector">
            <!-- Skins will be populated by JavaScript -->
          </div>
        </div>

        <button id="start-game" class="start-button">
          <span>START GAME</span>
          <div class="button-glow"></div>
        </button>
      </div>
    </div>

    <!-- Game Page (hidden initially) -->
    <div id="game-page" style="display: none;">
      <div id="ui">
        <div id="health-container" aria-label="Player health bar">
          <div id="health-bar"></div>
        </div>
        <div id="hud">
          <span id="wave">Wave 1</span>
          <span id="score">Score: 0</span>
        </div>
        <div id="powerups-indicator"></div>
        <div id="crosshair"></div>
        <div id="overlay" hidden>
          <div class="panel">
            <h1>Game Over</h1>
            <p id="final-score">Score: 0</p>
            <p id="coins-earned" class="coins-earned"></p>
            <button id="restart">Restart (R)</button>
            <button id="back-to-home">Back to Home</button>
            <div class="help">
              <p><strong>Controls</strong></p>
              <p>Move: WASD · Shoot: Mouse · Sprint: Shift</p>
            </div>
          </div>
        </div>
      </div>
      <canvas id="game" aria-label="Game canvas"></canvas>
    </div>

    <script src="main.js"></script>
  </body>
</html>
